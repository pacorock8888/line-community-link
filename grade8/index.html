  <style>
    :root { color-scheme: light; }

    body { margin: 0; min-height: 100vh; background: #f8f7f2; color: #203d32; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
    main { width: min(100%, 760px); margin: 0 auto; padding: 40px 20px; }
    .hero { display: flex; align-items: center; gap: 24px; padding: 8px 4px 30px; }
    .avatar { width: 132px; height: 132px; flex: 0 0 auto; object-fit: cover; border: 3px solid #fff; border-radius: 12px; box-shadow: 0 10px 26px #203d321a; }

    .join:hover { background: #066b3b; }
    .join:focus-visible { outline: 3px solid #203d32; outline-offset: 5px; }
    .help { margin: 22px 0 0; padding: 18px 20px; border-left: 4px solid #79a780; background: #eef2e9; color: #5b6e60; font-size: 16px; line-height: 1.8; }
    .help strong { color: #203d32; white-space: nowrap; }
    @media (max-width: 480px) {
      main { padding: 28px 18px; }
      .hero { gap: 16px; padding-bottom: 24px; }
      .avatar { width: 88px; height: 88px; }
      h1 { font-size: 24px; }
      .join-panel { padding: 18px; }
      .join { font-size: 18px; }
      .help { padding: 15px 16px; }

</head>
