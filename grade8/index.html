<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>11/22 國二二段複習入口</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f8f7f2; color: #203d32; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
main { width: min(100%, 760px); margin: 0 auto; padding: 40px 20px; }
a, button { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 64px; padding: 18px; border-radius: 10px; font: inherit; font-size: 20px; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
a { color: #fff; background: #087f46; border: 1px solid #087f46; }
a:hover { background: #066b3b; }
button { background: #fff; color: #203d32; border: 1px solid #b6cbbc; font-size: 18px; }
button:hover { background: #eef2e9; }
a:focus-visible, button:focus-visible { outline: 3px solid #203d32; outline-offset: 4px; }
p { margin: 24px 0; font-size: 15px; line-height: 1.8; text-align: center; color: #526558; }
p strong { display: block; color: #203d32; font-size: 17px; }
#status { min-height: 1.8em; margin: 12px 0 0; }
#manual { width: 100%; margin-top: 12px; padding: 12px; font: inherit; font-size: 16px; border: 1px solid #b6cbbc; border-radius: 8px; }
[hidden] { display: none !important; }
.hero { display: flex; align-items: center; gap: 24px; padding: 8px 4px 30px; }
.avatar { width: 132px; height: 132px; flex: 0 0 auto; object-fit: cover; border: 3px solid #fff; border-radius: 12px; box-shadow: 0 10px 26px #203d321a; }
h1 { margin: 0; font-size: 30px; line-height: 1.4; letter-spacing: .02em; }
.join-panel { padding: 26px; background: #fff; border: 1px solid #d6e2d6; border-radius: 14px; box-shadow: 0 8px 24px #203d3208; }
.help { margin: 22px 0 0; padding: 18px 20px; border-left: 4px solid #79a780; background: #eef2e9; color: #5b6e60; font-size: 16px; line-height: 1.8; text-align: left; }
.help strong { display: inline; color: #203d32; white-space: nowrap; font-size: inherit; }
@media (max-width: 480px) {
 main { padding: 28px 18px; }
 .hero { gap: 16px; padding-bottom: 24px; }
 .avatar { width: 88px; height: 88px; }
 h1 { font-size: 24px; }
 .join-panel { padding: 18px; }
 .help { padding: 15px 16px; }
}
h1 span { display: inline-block; }
.fallback { margin-top: 20px; padding: 16px; border-radius: 12px; background: #fff8e4; border: 1px solid #ebd493; }
.fallback h2 { font-size: 19px; margin: 0 0 12px; line-height: 1.4; }
.fallback #copy { min-height: 54px; padding: 12px 8px; color: #302400; background: #ffc83d; border: 1px solid #deaa23; gap: 8px; }
.fallback #copy:hover { background: #ffbb21; }
.steps { display: grid; gap: 10px; list-style: none; padding: 0; margin: 15px 0 0; color: #3c493f; font-size: 15px; line-height: 1.5; }
.steps li { display: flex; align-items: flex-start; gap: 8px; }
.num { flex: 0 0 22px; border-radius: 50%; text-align: center; line-height: 22px; font-size: 13px; font-weight: 700; color: #6b4800; background: #ffe6a5; }
.fallback #status:empty { display: none; }
@media (max-width: 480px) { .fallback { padding: 14px; } }
</style>
</head>
<body>
<main>
<header class="hero">
<img class="avatar" src="grade8-avatar.png" alt="國二複習 Paco 老師貼圖" width="132" height="132">
<h1><span>11/22 國二</span><wbr><span>二段複習入口</span></h1>
</header>
<div class="join-panel">
<a id="join" href="https://line.me/ti/g2/sf1BwPykMi43IW9NderDdiA1FmdL0aIYIKyQ1w?utm_source=invitation&amp;utm_medium=link_copy&amp;utm_campaign=default">加入 LINE 社群</a>
<section class="fallback" aria-labelledby="fallback-title">
<h2 id="fallback-title">加不進 LINE 社群怎麼辦？</h2>
<button id="copy" type="button"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>複製 LINE 社群連結</button>
<ol class="steps">
<li><span class="num">1</span><span>點上方黃色按鈕，複製連結。</span></li>
<li><span class="num">2</span><span>離開 Facebook，打開手機的 <b>Safari 或 Chrome</b>。</span></li>
<li><span class="num">3</span><span>長按<b>網址列</b>，點「貼上」，再按「前往」。</span></li>
</ol>
<p id="status" role="status" aria-live="polite"></p>
<input id="manual" aria-label="LINE 社群連結" readonly hidden>
</section>
</div>
<p class="help">如果無法加入，請洽詢官方 LINE：<strong>@498szsve</strong></p>
</main>
<script>
const join = document.querySelector('#join');
const copy = document.querySelector('#copy');
const status = document.querySelector('#status');
const manual = document.querySelector('#manual');
function fallbackCopy() {
  manual.hidden = false;
  manual.value = join.href;
  manual.focus();
  manual.select();
  manual.setSelectionRange(0, manual.value.length);
  let copied = false;
  try { copied = document.execCommand('copy'); } catch (_) {}
  if (copied) { manual.hidden = true; copy.focus(); }
  return copied;
}
copy.addEventListener('click', async () => {
  let copied = false;
  manual.hidden = true;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(join.href);
      copied = true;
    } else { copied = fallbackCopy(); }
  } catch (_) { copied = fallbackCopy(); }
  status.textContent = copied ? '已複製！請到 Safari 或 Chrome 的網址列貼上' : '請長按下方連結並複製';
});
</script>
</body>
</html>
