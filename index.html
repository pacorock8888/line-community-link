<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>三年級社群入口</title>
  <meta name="description" content="選擇報名方案，加入對應的 LINE 社群。">
  <style>
    :root {
      color-scheme: light;
      --line: #06c755;
      --ink: #17211b;
      --muted: #637268;
      --panel: #ffffff;
      --soft: #f4f7f2;
      --edge: #dce7df;
      --strong-edge: #bdd3c4;
      --accent: #295b3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--ink);
      background: #f7f8f5;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 28px 16px 36px;
    }

    .hero {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      padding: 18px 4px 22px;
    }

    .avatar {
      width: 132px;
      height: 132px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 8px;
      background: linear-gradient(145deg, var(--accent), #3f8758);
      box-shadow: 0 10px 26px rgba(23, 33, 27, 0.14);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      overflow: hidden;
    }

    .avatar img { width: 100%; height: 100%; display: none; object-fit: cover; }
    .avatar.has-image span { display: none; }
    .avatar.has-image img { display: block; }

    h1 { margin: 0; font-size: 28px; line-height: 1.22; }

    .intro { margin: 8px 0 0; color: var(--muted); font-size: 16px; line-height: 1.55; }

    .section-title {
      margin: 4px 2px 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    /* ---- 方案選擇 ---- */
    .plan-list { display: grid; gap: 12px; }

    .plan {
      width: 100%;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 22px rgba(31, 56, 39, 0.06);
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
      transition: border-color .15s, box-shadow .15s, transform .05s;
    }

    .plan:hover { border-color: var(--strong-edge); box-shadow: 0 10px 26px rgba(31, 56, 39, 0.12); }
    .plan:active { transform: translateY(1px); }

    .plan-code {
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border-radius: 10px;
      background: var(--soft);
      border: 1px solid var(--strong-edge);
      color: var(--accent);
      font-size: 20px; font-weight: 800;
    }

    .plan-body { min-width: 0; }
    .plan-label { font-size: 16px; font-weight: 700; }
    .plan-desc { margin-top: 3px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .plan-arrow { color: var(--strong-edge); font-size: 20px; }

    /* ---- 加入社群檢視 ---- */
    .join-view { display: none; }
    .join-view.active { display: block; }
    .plan-list.hidden { display: none; }

    .back {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 0 0 14px;
      border: 0; background: none; padding: 4px 0;
      color: var(--accent); font: inherit; font-weight: 700; font-size: 15px;
      cursor: pointer;
    }

    .chosen {
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1px solid var(--strong-edge);
      border-radius: 8px;
      background: var(--soft);
      font-size: 15px; line-height: 1.55;
    }
    .chosen strong { color: var(--accent); }

    .join {
      width: 100%;
      min-height: 56px;
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 8px;
      background: var(--line);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 24px rgba(6, 199, 85, 0.22);
      cursor: pointer;
    }
    .join svg { width: 20px; height: 20px; flex: 0 0 auto; }
    .join .join-name { }

    .copy-line {
      display: flex; justify-content: flex-end;
      margin: -6px 2px 16px;
    }
    .copy-button {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--strong-edge);
      border-radius: 8px;
      background: #eef5ef;
      color: var(--accent);
      font: inherit; font-size: 13px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .copy-button svg { width: 15px; height: 15px; }

    .status { min-height: 18px; margin: -8px 2px 14px; color: var(--accent); font-size: 13px; }

    .support {
      margin-top: 18px;
      padding: 14px 16px;
      border-left: 4px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    .support strong { color: var(--ink); }

    /* ---- 警語關卡 ---- */
    .warning-view { display: block; }
    .warning-view.hidden { display: none; }

    .warning-card {
      padding: 22px 20px 20px;
      border: 2px solid var(--strong-edge);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(31, 56, 39, 0.10);
    }

    .warning-title {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.35;
      color: #b3261e;
      text-align: center;
    }

    .warning-body {
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 8px;
      background: var(--soft);
      border: 1px solid var(--edge);
    }
    .warning-body p { margin: 0; font-size: 16px; line-height: 1.6; }
    .warning-body b { color: var(--accent); font-size: 17px; }
    .warning-body .hint { margin-top: 2px; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .warning-extra {
      margin: 14px 2px 0;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
    }
    .warning-extra b { color: #b3261e; }

    .warning-note {
      margin: 14px 2px 18px;
      color: #b3261e;
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
      font-weight: 700;
    }

    .ack-btn {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      background: var(--line);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s;
    }
    .ack-btn:disabled {
      background: #b9c6bd;
      color: #eef2ee;
      cursor: not-allowed;
    }

    @media (max-width: 560px) {
      main { padding-top: 20px; }
      .hero { grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
      .avatar { width: 96px; height: 96px; font-size: 21px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="avatar" id="avatar" aria-hidden="true">
        <img src="" alt="">
        <span>課</span>
      </div>
      <div>
        <h1>三年級社群入口</h1>
        <p class="intro">請選擇你報名的方案，系統會列出你要加入的社群。</p>
      </div>
    </header>

    <!-- 警語關卡（第一關）-->
    <section id="warningView" class="warning-view" aria-label="加入前須知">
      <div class="warning-card">
        <h2 class="warning-title">⚠️ 進群前必看</h2>
        <div class="warning-body">
          <p><strong>學生</strong>：名字＋手機末三碼　例：<b>百宏313</b></p>
          <p><strong>家長</strong>：名字＋媽／爸＋末三碼　例：<b>百宏媽313</b></p>
          <p class="hint">＊末三碼＝報名時登記的那支手機號碼後三碼</p>
        </div>
        <p class="warning-note">請選對方案，老師會逐一核對；名稱不符者將被移除。<br>請勿將連結轉傳給未報名者，以免造成困擾 🙏</p>
        <button class="ack-btn" id="ackBtn" type="button" disabled>請詳閱（8）</button>
      </div>
    </section>

    <!-- 方案選擇 -->
    <section id="planList" class="plan-list hidden" aria-label="報名方案"></section>

    <!-- 加入社群 -->
    <section id="joinView" class="join-view" aria-label="加入社群">
      <button class="back" type="button" id="backBtn">← 重新選擇方案</button>
      <div class="chosen" id="chosen"></div>
      <div id="joinButtons"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <div class="support">
      如果無法加入，請洽詢官方 LINE：<strong>@498szsve</strong>
    </div>
  </main>

  <script>
    /* ===== 設定區（只需要改這裡）===== */
    const AVATAR_URL = "science-avatar.png";

    // 三個社群：名稱 + 邀請連結
    const COMMUNITIES = {
      jiushang: { name: "九上理化進度班", url: "https://line.me/ti/g2/14Fvx1xSUwvCSGRJheCOMlH_0TULY4QbPWCNBg?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" },
      bashang:  { name: "八上理化複習",   url: "https://line.me/ti/g2/sxmIFZPuqnpW3M9nRO0MnwOoPHfc8hGgK6nZgw?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" },
      shengwu:  { name: "生物複習",       url: "https://line.me/ti/g2/hnq1LD54W_yPd80CVviVrJRSQlrwFSZMmJQ1xA?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" },
    };

    // 六個方案 A–F：包含哪幾個社群
    const PLANS = [
      { code: "A", communities: ["jiushang", "bashang", "shengwu"] },
      { code: "B", communities: ["jiushang", "shengwu"] },
      { code: "C", communities: ["jiushang", "bashang"] },
      { code: "D", communities: ["bashang", "shengwu"] },
      { code: "E", communities: ["shengwu"] },
      { code: "F", communities: ["bashang"] },
    ];
    /* ===== 設定區結束 ===== */

    const planDesc = (plan) => plan.communities.map(k => COMMUNITIES[k].name).join(" + ");

    const avatar = document.querySelector("#avatar");
    const avatarImage = avatar.querySelector("img");
    const warningView = document.querySelector("#warningView");
    const ackBtn = document.querySelector("#ackBtn");
    const planList = document.querySelector("#planList");
    const joinView = document.querySelector("#joinView");
    const joinButtons = document.querySelector("#joinButtons");
    const chosen = document.querySelector("#chosen");
    const statusEl = document.querySelector("#status");

    if (AVATAR_URL) {
      avatarImage.src = AVATAR_URL;
      avatar.classList.add("has-image");
    }

    function iconArrow() {
      return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    function iconCopy() {
      return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="10" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M6 16H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    }

    function renderPlans() {
      planList.innerHTML =
        '<p class="section-title">請選擇你的報名方案</p>' +
        PLANS.map((plan, i) => `
          <button class="plan" type="button" data-plan="${i}">
            <span class="plan-code">${plan.code}</span>
            <span class="plan-body">
              <span class="plan-label">${plan.code} 方案</span>
              <span class="plan-desc">${planDesc(plan)}</span>
            </span>
            <span class="plan-arrow">›</span>
          </button>
        `).join("");
    }

    function showJoin(planIndex) {
      const plan = PLANS[planIndex];
      chosen.innerHTML = `你選擇的是 <strong>${plan.code} 方案</strong>：${planDesc(plan)}<br>請點擊下方按鈕加入社群 👇`;
      joinButtons.innerHTML = plan.communities.map((key) => {
        const c = COMMUNITIES[key];
        return `
          <a class="join" href="${c.url}" rel="noopener">
            ${iconArrow()}<span class="join-name">加入「${c.name}」</span>
          </a>
          <div class="copy-line">
            <button class="copy-button" type="button" data-copy="${key}">
              ${iconCopy()} 複製連結
            </button>
          </div>`;
      }).join("");
      statusEl.textContent = "";
      planList.classList.add("hidden");
      joinView.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function backToPlans() {
      joinView.classList.remove("active");
      planList.classList.remove("hidden");
      statusEl.textContent = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function copyUrl(key) {
      try {
        await navigator.clipboard.writeText(COMMUNITIES[key].url);
        statusEl.textContent = `已複製「${COMMUNITIES[key].name}」的連結。`;
      } catch (e) {
        statusEl.textContent = "複製失敗，請直接點上方綠色按鈕加入。";
      }
    }

    // 倒數關卡：5 秒後才能按「我知道」
    const COUNTDOWN_SECONDS = 8;
    function startCountdown() {
      let remaining = COUNTDOWN_SECONDS;
      ackBtn.disabled = true;
      ackBtn.textContent = `請詳閱（${remaining}）`;
      const timer = setInterval(() => {
        remaining -= 1;
        if (remaining > 0) {
          ackBtn.textContent = `請詳閱（${remaining}）`;
        } else {
          clearInterval(timer);
          ackBtn.disabled = false;
          ackBtn.textContent = "我知道了，選擇方案 ›";
        }
      }, 1000);
    }

    ackBtn.addEventListener("click", () => {
      if (ackBtn.disabled) return;
      warningView.classList.add("hidden");
      planList.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderPlans();
    startCountdown();

    planList.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-plan]");
      if (btn) showJoin(Number(btn.dataset.plan));
    });
    document.querySelector("#backBtn").addEventListener("click", backToPlans);
    joinButtons.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy]");
      if (btn) copyUrl(btn.dataset.copy);
    });
  </script>
</body>
</html>
