<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>加入課程 LINE 社群</title>
  <meta name="description" content="加入課程 LINE 社群，接收複習課程資訊。">
  <style>
    :root {
      color-scheme: light;
      --line: #06c755;
      --ink: #17211b;
      --muted: #5f6f66;
      --panel: #ffffff;
      --soft: #eff8f2;
      --edge: #d6eadc;
      --warn: #9b5b00;
      --warn-bg: #fff6df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 15%, rgba(6, 199, 85, 0.16), transparent 28rem),
        linear-gradient(145deg, #f9fffb 0%, #eaf6ee 55%, #f7faf8 100%);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    .panel {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: 0 22px 60px rgba(19, 67, 36, 0.12);
      padding: 30px 24px 24px;
    }

    .mark {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--line);
      color: white;
      font-weight: 800;
      font-size: 22px;
      line-height: 1;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .button {
      width: 100%;
      min-height: 56px;
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 8px;
      background: var(--line);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(6, 199, 85, 0.26);
      cursor: pointer;
    }

    .button[aria-disabled="true"] {
      background: #95baa1;
      box-shadow: none;
      cursor: not-allowed;
    }

    .button svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    .fallback {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background: var(--soft);
      border: 1px solid var(--edge);
      overflow-wrap: anywhere;
    }

    .fallback strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .fallback code {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .notice {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid #f4d287;
      border-radius: 8px;
      background: var(--warn-bg);
      color: var(--warn);
      font-size: 14px;
      line-height: 1.5;
    }

    .is-missing .notice {
      display: block;
    }

    @media (max-width: 420px) {
      .panel {
        padding: 26px 18px 20px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" id="panel">
      <div class="mark" aria-hidden="true">LINE</div>
      <h1>加入課程 LINE 社群</h1>
      <p>點下方按鈕即可開啟 LINE，加入複習課程社群。</p>

      <a class="button" id="joinButton" href="#" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        加入 LINE 社群
      </a>

      <div class="fallback">
        <strong>如果按鈕無法開啟，請複製這個網址：</strong>
        <code id="fallbackUrl">尚未設定 LINE 社群連結</code>
      </div>

      <div class="notice">目前頁面還沒放入 LINE 社群連結。請先提供你的社群邀請網址，我會替你完成設定。</div>
    </section>
  </main>

  <script>
    const LINE_COMMUNITY_URL = "https://line.me/ti/g2/fA39gcNI-sDLhQg-yM8ajb1_kQvnNCb6K1DkCQ?utm_source=invitation&utm_medium=link_copy&utm_campaign=default";
    const isConfigured = /^https:\/\/.+/i.test(LINE_COMMUNITY_URL)
      && !LINE_COMMUNITY_URL.includes("PASTE_LINE_COMMUNITY_LINK_HERE");

    const panel = document.querySelector("#panel");
    const button = document.querySelector("#joinButton");
    const fallback = document.querySelector("#fallbackUrl");

    if (isConfigured) {
      button.href = LINE_COMMUNITY_URL;
      fallback.textContent = LINE_COMMUNITY_URL;
    } else {
      panel.classList.add("is-missing");
      button.setAttribute("aria-disabled", "true");
      button.addEventListener("click", (event) => event.preventDefault());
    }
  </script>
</body>
</html>
